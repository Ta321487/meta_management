server:
  port: 8080
  servlet:
    context-path: /metadata-system

spring:
  application:
    name: metadata-system
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/metadata_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 1719406
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: MetadataHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
  # 热部署配置
  devtools:
    restart:
      enabled: true
      # 排除不需要重启的目录
      exclude: WEB-INF/**
      # 自定义重启目录
      additional-paths: src/main/java
  thymeleaf:
    cache: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.metadata.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.metadata: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

# 跨域配置
cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# 管理员配置
admin:
  default-username: admin
  default-password: 123456

# Swagger UI配置
springdoc:
  swagger-ui:
    # 设置Swagger UI语言为中文
    locale: zh-CN

